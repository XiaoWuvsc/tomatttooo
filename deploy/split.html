<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>切图工具 · tomatttooo</title>
  <meta name="description" content="tomatttooo 切图工具 —— 九宫格切图、三格横切，一键导出 ZIP。">
  <link rel="icon" href="assets/brand/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tools.css?v=18">

  <link rel="stylesheet" href="css/liquid-glass.css?v=25" id="glass-css">  <style>
    .thumbs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 1.2rem; }
    .thumbs canvas { border-radius: 6px; border: 1px solid var(--line); background: #1a1a1a; }
    .split-note { text-align: center; color: var(--accent-soft); font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.4em; }
  </style>
</head>
<body class="tool-page">

  <header class="t-nav">
    <a class="t-nav__logo" href="index.html">
      <img class="t-nav__mark" src="assets/brand/avatar.png" alt="tomatttooo">
      tomatttooo<span style="color:#ff6347">.</span>
    </a>
    <nav class="t-nav__links">
      <a href="index.html">返回主页</a>
      <a href="tools.html">工具选择</a>
    </nav>
  </header>

  <main class="t-shell">
    <div class="t-head">
      <p class="t-eyebrow">SPLIT TOOL · 小工具</p>
      <h1 class="t-title">切图工具</h1>
      <p class="t-desc">九宫格切图发朋友圈，或把横图切成三格拼图，一键导出 ZIP。</p>
    </div>

    <button class="t-drop" id="drop" type="button">
      <strong>点击或拖入照片</strong>
      <small>JPEG / PNG / WebP</small>
    </button>
    <input type="file" id="file" accept="image/*" hidden>

    <div class="crop-controls" id="controls" hidden>
      <div class="t-chips" id="mode-chips">
        <button type="button" class="t-chip is-active" data-mode="grid9">九宫格 3×3 · 裁正方形</button>
        <button type="button" class="t-chip" data-mode="grid9raw">九宫格 3×3 · 原比例</button>
        <button type="button" class="t-chip" data-mode="strip3">三格横切 1×3</button>
        <button type="button" class="t-chip" data-mode="strip2">二格横切 1×2</button>
      </div>
      <div class="split-note" id="split-note"></div>
    </div>

    <div class="t-stage" id="stage">
      <div class="t-empty" id="empty">🧩 导入照片开始切图</div>
      <canvas class="t-canvas" id="canvas"></canvas>
    </div>

    <div class="thumbs" id="thumbs"></div>

    <div class="t-actions">
      <button class="t-btn" id="btn-export" type="button" disabled>⬇ 导出 ZIP</button>
    </div>
  </main>

  <footer class="t-footer">© <span id="year">2025</span> tomatttooo · 用镜头记录世界</footer>

  <script src="js/page-transition.js?v=1"></script>
  <script src="js/theme-toggle.js?v=8"></script>
  <script src="js/icons.js?v=6"></script>
  <script src="js/split.js?v=3"></script>
</body>
</html>
